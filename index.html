  <style>
    :root {
      --ink: #1a2a28;
      --pine: #2d5a4a;
      --gold: #c4a574;
      --paper: #f7faf8;
      --mist: #7a9e94;
      --coral: #c45c4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(160deg, #1e3d34 0%, #2a5045 45%, #3a6354 100%);
    }
    .card {
      width: min(420px, 100%);
      background: var(--paper);
      padding: 2rem 1.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,.22);
    }
    h1 {
      font-family: "Shippori Mincho", serif;
      font-size: 1.75rem;
      color: var(--pine);
      letter-spacing: .08em;
      margin-bottom: .4rem;
    }
    p {
      color: var(--mist);
      font-size: .92rem;
      line-height: 1.6;
      margin-bottom: 1.4rem;
    }
    label {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--pine);
      margin-bottom: .45rem;
    }
    input {
      width: 100%;
      padding: .85rem 1rem;
      border: 1px solid rgba(45,90,74,.25);
      background: #fff;
      font: inherit;
      font-size: 1rem;
      margin-bottom: .9rem;
    }
    input:focus { outline: 2px solid var(--gold); border-color: transparent; }
    button {
      width: 100%;
      padding: .9rem 1rem;
      border: none;
      background: var(--gold);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .err {
      display: none;
      margin-top: .85rem;
      color: var(--coral);
      font-size: .85rem;
      font-weight: 500;
    }
    .err.show { display: block; }
    .hint {
      margin-top: 1rem;
      font-size: .75rem;
      color: var(--mist);
    }
  </style>
</head>

    const SESSION_KEY = "tohoku-family-unlocked-v2";

    async function deriveKey(password, saltB64, iterations) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptWithPassword(password) {
      const key = await deriveKey(password, PAYLOAD.salt, PAYLOAD.iter);
      const nonce = Uint8Array.from(atob(PAYLOAD.nonce), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(PAYLOAD.data), c => c.charCodeAt(0));
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, data);
      return new TextDecoder().decode(plain);
    }

    function remember(password) {
      const value = JSON.stringify({ p: password });
      try {
        localStorage.setItem(SESSION_KEY, value);
        sessionStorage.removeItem(SESSION_KEY);
      } catch (e) {
        try { sessionStorage.setItem(SESSION_KEY, value); } catch (ignored) {}
      }
    }

    function forget() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    function siteBase() {
      let path = location.pathname;
      if (/\/index\.html?$/i.test(path)) path = path.replace(/\/index\.html?$/i, "/");
      if (!path.endsWith("/")) path += "/";
      return location.origin + path;
    }

    function withAbsoluteAssets(html) {
      const base = siteBase();
      let out = html;
      if (!/<base\s/i.test(out)) {
        out = out.replace(/<head([^>]*)>/i, `<head$1><base href="${base}">`);
      }
      // Extra safety after document.write: force images/ CSS urls absolute
      out = out.replace(
        /(src|href)=(["'])(images\/[^"']+)\2/g,
        (_, attr, q, path) => `${attr}=${q}${base}${path}${q}`
      );
      out = out.replace(
        /url\((["']?)(images\/[^"')]+)\1\)/g,
        (_, q, path) => `url(${q}${base}${path}${q})`
      );
      return out;
    }

    async function tryUnlock(password, save) {
      const html = withAbsoluteAssets(await decryptWithPassword(password));
      if (save) remember(password);
      document.open();
      document.write(html);
      document.close();
    }

    (async function boot() {
      try {
        const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved.p) {
          forget();
          return;
        }
        await tryUnlock(saved.p, false);
      } catch (e) {
        forget();
      }
    })();

    document.getElementById("gate").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      const password = document.getElementById("pw").value;
      try {
        await tryUnlock(password, true);
      } catch (e) {
        err.classList.add("show");
      }
    });
  </script>
